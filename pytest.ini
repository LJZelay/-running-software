[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Only collect tests from the unified suite.
testpaths =
    tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    domain: Domain layer unit tests
    application: Application layer unit tests
    external: External interface layer tests
    integration: Integration tests
